# Grafana front door.
#
# Anonymous access is intentionally enabled so the "GPU Cluster (Public)"
# dashboard can be opened without a login. The catch: a Viewer - including an
# anonymous visitor - can read notification resources, and those responses
# contain the contact point settings, i.e. the Feishu webhook URL in clear text
# (the URL is itself a credential: anyone holding it can post into the group).
#
# Grafana OSS has no switch to deny that to Viewers (its own RBAC table grants
# Viewers "view contact points"), so the two leaking path families are put
# behind an "is this a logged-in Grafana user?" subrequest:
#   * GET /api/user returns 200 for a logged-in user, 401 for anonymous.
#
# Everything else is proxied untouched: dashboards, /apis/dashboard.grafana.app,
# /apis/folder.grafana.app, POST /api/ds/query, static assets. Do NOT widen the
# blocked prefixes to /apis/ - the current UI needs dashboard/folder APIs
# anonymously to render the public dashboard.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream grafana_backend {
    server grafana:3000;
    keepalive 16;
}

server {
    listen 3000;
    server_name _;

    client_max_body_size 20m;

    # Inherited by every location that does not set proxy_set_header itself.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 300s;

    # Internal subrequest used by auth_request below.
    # 200 => real Grafana session/credentials, 401 => anonymous.
    location = /_grafana_is_authenticated {
        internal;
        proxy_pass              http://grafana_backend/api/user;
        proxy_method            GET;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        Host          $host;
        proxy_set_header        Cookie        $http_cookie;
        proxy_set_header        Authorization $http_authorization;
    }

    # Notification resources: leak the webhook URLs to anyone who asks.
    location ~ ^/(api/v1/provisioning|api/v1/notifications|apis/notifications\.alerting\.grafana\.app) {
        auth_request /_grafana_is_authenticated;
        proxy_pass http://grafana_backend;
    }

    location / {
        proxy_pass http://grafana_backend;
    }
}
