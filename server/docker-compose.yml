services:
  prometheus:
    # Pinned: `latest` silently upgrades (and breaks) monitoring on a restart.
    # Upgrade deliberately: bump the tag, then `docker compose up -d`.
    image: prom/prometheus:v3.11.3
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Directory (not a single file) so that editors which replace the file
      # (vim / sed -i / ansible copy) are actually picked up by file_sd.
      - ./targets.d:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    # Pinned for the same reason as Prometheus; the container was running 13.0.1.
    image: grafana/grafana:13.0.1
    container_name: grafana
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      # 不直接暴露在 0.0.0.0：对外统一走 grafana-proxy（可拦截泄漏端点的那个
      # 反向代理）。这里保留一个仅本机可达的直连端口作为应急通道，
      # 需要时 `ssh -L 3001:127.0.0.1:3001 <server>` 即可绕开代理。
      - "127.0.0.1:${GRAFANA_DIRECT_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      # 启用 Grafana Unified Alerting（Grafana 9+ 默认已启用）
      - GF_UNIFIED_ALERTING_ENABLED=true
      # 告警评估时写入的日志级别
      - GF_UNIFIED_ALERTING_EXECUTION_LOG_LEVEL=debug
      # 对外 URL（影响告警通知中的 Source/Silence 链接）
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL:-http://localhost:3000}
      # 告警投递目标：Grafana -> feishu-relay -> 飞书自定义机器人。
      # 飞书 BotBuilder 触发器地址（www.feishu.cn/flow/api/trigger-webhook/...）
      # 已于 2026-06-30 下线，现在返回 HTTP 403「服务已下线」，故改走 relay。
      - ALERT_RELAY_URL=${ALERT_RELAY_URL:-http://feishu-relay:8080/webhook}
    depends_on:
      - prometheus
    restart: unless-stopped

  # Grafana 的对外入口：匿名仍可看 Public 看板，但告警通知类 API 只对
  # 已登录用户开放（匿名访客本来就能读到 contact point 里的地址）。
  grafana-proxy:
    image: nginx:1.27-alpine
    container_name: grafana-proxy
    volumes:
      - ./proxy/grafana.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - grafana
    restart: unless-stopped

  # Grafana 的 webhook 载荷格式飞书不认（飞书只接受 msg_type/content 信封），
  # 且 Grafana 没有原生飞书通道，因此用这个转换器转发。
  feishu-relay:
    image: python:3.11-slim
    container_name: feishu-relay
    command: ["python", "-u", "/app/relay.py"]
    volumes:
      - ./feishu-relay/relay.py:/app/relay.py:ro
    environment:
      # 支持多个群：URL / 加签密钥 / 关键词均可逗号分隔，按顺序对应
      - FEISHU_WEBHOOK_URL=${FEISHU_WEBHOOK_URL:-}
      - FEISHU_SIGN_SECRET=${FEISHU_SIGN_SECRET:-}
      - FEISHU_KEYWORD=${FEISHU_KEYWORD:-}
      - TZ=${TZ:-Asia/Shanghai}
    healthcheck:
      # TCP 探活：/healthz 在未配置 FEISHU_WEBHOOK_URL 时会返回 503，那是配置
      # 状态而不是进程故障，不该让容器长期显示 unhealthy。
      test: ["CMD", "python", "-c", "import socket;socket.create_connection(('127.0.0.1',8080),3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
