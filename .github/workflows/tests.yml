name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python test dependencies
        run: pip install pyyaml prometheus_client

      # pre-pull so the static checks can run promtool and the container suites
      # do not spend time pulling images inside the run
      - name: Pull container images
        run: |
          docker pull prom/prometheus:v3.11.3
          docker pull nginx:1.27-alpine
          docker pull alpine:latest

      - name: Run all suites
        run: make test
